[package]
name = "z-switch-cli"
version = "0.3.1"
description = "z-switch-cli · Claude Code / Codex / Grok 供应商一键切换命令行工具"
authors = ["ztest.ai", "Colorful"]
edition = "2021"

[[bin]]
name = "z-switch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "5"
fs2 = "0.4"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
inquire = "0.7"
colored = "2.1"
indicatif = "0.17"
rand = "0.8"
